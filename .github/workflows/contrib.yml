name: Contrib

on:
  pull_request_target:
    types: [closed]
    branches: [master, v1]
  workflow_dispatch:
    inputs:
      contributor:
        description: GitHub username
        required: true
        type: string
      release:
        description: Changelog section
        required: false
        default: Unreleased
        type: string

jobs:
  update_changelog:
    name: Update Changelog
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.author_association != 'COLLABORATOR' &&
       github.event.pull_request.author_association != 'MEMBER' &&
       github.event.pull_request.author_association != 'OWNER' &&
       endsWith(github.event.pull_request.user.login, '[bot]') == false &&
       endsWith(github.event.pull_request.user.login, '-bot') == false)
    env:
      CONTRIBUTOR: ${{ inputs.contributor || github.event.pull_request.user.login }}
      RELEASE: ${{ inputs.release || 'Unreleased' }}
      BASE: ${{ github.base_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE }}

      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SDK_MAINTAINER_BOT_APP_ID }}
          private-key: ${{ secrets.SDK_MAINTAINER_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check access
        id: access
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: process.env.CONTRIBUTOR.replace(/^@/, ''),
            });
            core.setOutput('external', !['admin', 'write'].includes(data.permission));

      - name: Credit contributor
        if: steps.access.outputs.external == 'true'
        run: python3 scripts/contrib.py "$CONTRIBUTOR" --release "$RELEASE"

      - name: Create PR
        if: steps.access.outputs.external == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: Update CHANGELOG.md"
          title: "chore: credit external contributor"
          branch: chore/contrib-${{ github.event.number || github.run_id }}
          base: ${{ env.BASE }}
          delete-branch: true
          body: >-
            Credits @${{ env.CONTRIBUTOR }} in the ${{ env.RELEASE }} section
            of CHANGELOG.md.
